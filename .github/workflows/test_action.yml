# This workflow is used to test the action

on:
  push:
  pull_request:

jobs:
  test:
    name: Test action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - id: build
        uses: OpenAstronomy/build-python-dist@541e0aa2abd94d679c4939189fa205597122c948  # v1.2.0
        with:
          pure_python_wheel: true
      - id: upload
        uses: ./
        with:
          anaconda_user: OpenAstronomyCI
          anaconda_package: test-package
          anaconda_token: ${{ secrets.anaconda_token }}
          keep_n_latest: 2
  test_no_keep:
    name: Test action (no keep option specified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - id: build
        uses: OpenAstronomy/build-python-dist@541e0aa2abd94d679c4939189fa205597122c948  # v1.2.0
        with:
          pure_python_wheel: true
      - id: upload
        uses: ./
        with:
          anaconda_user: OpenAstronomyCI
          anaconda_package: test-package
          anaconda_token: ${{ secrets.anaconda_token }}
